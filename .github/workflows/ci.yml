name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run CI checks
        run: mise run ci

      - name: Validate release configuration
        run: mise run release-check
